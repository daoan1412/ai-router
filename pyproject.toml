[project]
name = "mcp-ai-router"
version = "0.1.9"
description = "Stdio MCP server for Cursor, Claude Code, and other clients — route prompts to Gemini, ChatGPT, Claude, DeepSeek & Kimi via browser sessions. uv tool install mcp-ai-router"
authors = [{ name = "Olivier Taylor", email = "olivier.taylor.work@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["mcp", "gemini", "chatgpt", "claude", "deepseek", "kimi", "cursor", "ai"]
requires-python = ">=3.11,<4"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer>=0.15,<0.16",
  "cloakbrowser>=0.4.10,<0.5",
  "mcp>=1.13,<2",
  "uvicorn>=0.30",
  "pyyaml>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/scriptkid23/ai-router"
Repository = "https://github.com/scriptkid23/ai-router"

[project.scripts]
ai-router = "ai_router.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<0.25",
  "ruff>=0.6,<0.7",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "ai_router"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src"]
